[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "r2h"
version = "0.1.0"
description = "R2H 주가 급등 국면 포착 — 공통 데이터 계약·feature·탐지 인터페이스·평가 스캐폴드 (1012 기준선)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
]
research = [
  "scikit-learn>=1.4",
  "finance-datareader>=0.9.90",
  "pyarrow>=15",
]
notebook = [
  "matplotlib>=3.8",
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/r2h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# 보고서 산출물 폴더의 생성 스크립트(긴 한국어 본문 문자열)는 lint·format 대상에서 뺀다
extend-exclude = ["deliverables"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "RUF", "BLE"]
# PD009/PD010: .iat and .pivot are explicit, supported pandas APIs used deliberately.
# RUF001-003: Korean docstrings use typographic −, ×, ≤ on purpose.
ignore = ["PD009", "PD010", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
# Formatter wraps code at 110; Korean prose in docstrings/comments may run slightly longer.
max-line-length = 125

[tool.ruff.lint.per-file-ignores]
# Byte-identical copy of SA_ETF Track B src/paper2020/cusum.py (sha256 bb686701…) — kept unmodified for provenance.
"src/r2h/detection/paper2020_cusum.py" = ["UP042", "I001"]
# Byte-identical copies of SA_ETF Track B src/paper2020/* (research/track-b-paper2020@031157d) — unmodified for provenance.
"src/r2h/paper2020/*.py" = ["UP042", "I001", "E501", "RUF", "B", "UP"]
# Notebooks: Korean text counts double width (E501); loop variables used inside pandas .query("@var") strings are
# invisible to ruff (B007); E402/E731 for imports after the font-setup cell and tiny lambdas; E701/E702: short axis-setting
# statements share one line (and one comment).
"notebooks/*.ipynb" = ["E501", "B007", "E402", "E731", "E701", "E702"]

[tool.ruff.format]
# Notebooks are not auto-formatted: the formatter would wrap lines and break the "one Korean comment per code line" rule.
exclude = ["src/r2h/detection/paper2020_cusum.py", "src/r2h/paper2020/*.py", "notebooks/*.ipynb"]

[tool.mypy]
python_version = "3.11"
files = ["src/r2h"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Verbatim Track B modules (provenance); type-checked upstream, not modified here.
module = ["r2h.paper2020", "r2h.paper2020.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "FinanceDataReader", "FinanceDataReader.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy ships no type information (no py.typed / stubs package).
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
